services:
  postgres:
    container_name: test-chatwoot-postgres
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./docker_data/postgres:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5439:5432'
    networks:
      - shared-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:alpine
    container_name: test-chatwoot-redis
    restart: always
    networks:
      - shared-net
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: >
      redis-server --requirepass "${REDIS_PASSWORD}" --port 6384 --appendonly yes
    volumes:
      - ./docker_data/redis:/data
    ports:
      - '127.0.0.1:6384:6384'
    env_file: .env.dev

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
      # BuildKit cache mounts for faster rebuilds
      cache_from:
        - type=local,src=/tmp/.buildx-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env.dev
    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - CHATWOOT_BASE_URL=http://localhost:3002
      - FRONTEND_URL=http://localhost:3002
      - RAILS_ENV=development
      - NODE_ENV=development
      - BUNDLE_WITHOUT=
      - BUNDLE_PATH=/bundle
      - INSTALLATION_ENV=docker
      - DB_POOL=25
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=chatwoot_production
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/chatwoot_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6384
      - WEBPACKER_DEV_SERVER_HOST=0.0.0.0
      - FORCE_SSL=false
      - DISABLE_FORCE_SSL=true
      - VITE_RUBY_HOST=vite
      - VITE_RUBY_PORT=3036
      - VITE_RUBY_AUTO_BUILD=false
      - VITE_RUBY_HMR_HOST=localhost
    volumes:
      # Mount source code for hot reload (but exclude node_modules and bundle)
      - .:/app:cached
      # Persistent volumes for dependencies (faster than re-mounting from image)
      - bundle_cache:/bundle
      - node_modules_cache:/app/node_modules
      # Anonymous volumes for temporary files (prevents permission issues)
      - /app/tmp
      - /app/log
    command: |
      bash -lc "
      set -e;
      until PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U postgres -d chatwoot_production -c 'select 1' >/dev/null 2>&1; do
        echo 'Waiting for postgres auth...';
        sleep 2;
      done;
      
      # Only run bundle install if Gemfile.lock has changed
      if ! bundle check >/dev/null 2>&1; then
        echo 'Installing Ruby gems...'
        bundle install --jobs 4 --retry 3
      else
        echo 'Ruby gems already installed, skipping bundle install'
      fi
      
      # Start Rails server
      bundle exec rails s -p 3002 -b 0.0.0.0
      "
    ports:
      - "0.0.0.0:3002:3002"
    networks:
      - shared-net
    container_name: test-chatwoot-rails
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
      cache_from:
        - type=local,src=/tmp/.buildx-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env.dev
    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - CHATWOOT_BASE_URL=http://localhost:3002
      - FRONTEND_URL=http://localhost:3002
      - RAILS_ENV=development
      - NODE_ENV=development
      - BUNDLE_WITHOUT=
      - BUNDLE_PATH=/bundle
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=test-chatwoot-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=chatwoot_production
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/chatwoot_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6384
      - FORCE_SSL=false
      - DISABLE_FORCE_SSL=true
    volumes:
      - .:/app:cached
      - bundle_cache:/bundle
      - node_modules_cache:/app/node_modules
      - /app/tmp
      - /app/log
    command: |
      bash -lc "
      set -e;
      until PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U postgres -d chatwoot_production -c 'select 1' >/dev/null 2>&1; do
        echo 'Waiting for postgres auth...';
        sleep 2;
      done;
      
      # Only run bundle install if needed
      if ! bundle check >/dev/null 2>&1; then
        echo 'Installing Ruby gems...'
        bundle install --jobs 4 --retry 3
      else
        echo 'Ruby gems already installed, skipping bundle install'
      fi
      
      # Start Sidekiq worker
      bundle exec sidekiq -C config/sidekiq.yml
      "
    networks:
      - shared-net
    container_name: test-chatwoot-sidekiq
    restart: always

  vite:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
      cache_from:
        - type=local,src=/tmp/.buildx-cache
    depends_on:
      web:
        condition: service_started
    env_file: .env.dev
    environment:
      - NODE_ENV=development
      - RAILS_ENV=development
      - VITE_RUBY_HOST=0.0.0.0
      - VITE_RUBY_PORT=3036
      - BUNDLE_PATH=/bundle
      - POSTGRES_HOST=test-chatwoot-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=chatwoot_production
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/chatwoot_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6384
      - VITE_ALLOW_EXTERNAL_HOSTS=true
      # Use native file watching instead of polling for better performance
      - CHOKIDAR_USEPOLLING=false
      # Enable file system events
      - VITE_RUBY_HMR_HOST=localhost
    volumes:
      # Mount source code with cached option for better performance
      - .:/app:cached
      - bundle_cache:/bundle
      # Critical: Share node_modules from the image, not as a volume
      # This prevents the slow pnpm install on every start
      - node_modules_cache:/app/node_modules
    command: |
      bash -lc "
      set -e
      
      # Only install dependencies if package.json or pnpm-lock.yaml has changed
      # Check if node_modules is properly populated
      if [ ! -d 'node_modules/.pnpm' ] || [ ! -f 'node_modules/.modules.yaml' ]; then
        echo 'Installing Node.js dependencies (first time or cache invalid)...';
        pnpm install --frozen-lockfile --prefer-offline;
      elif [ 'package.json' -nt 'node_modules/.modules.yaml' ] || [ 'pnpm-lock.yaml' -nt 'node_modules/.modules.yaml' ]; then
        echo 'Dependencies changed, running pnpm install...';
        pnpm install --frozen-lockfile --prefer-offline;
      else
        echo 'Dependencies up to date, skipping pnpm install';
      fi
      
      # Start Vite dev server with optimized HMR settings
      echo 'Starting Vite dev server...';
      ./node_modules/.bin/vite dev --host 0.0.0.0 --port 3036 --cors --strictPort
      "
    ports:
      - "0.0.0.0:3036:3036"
    networks:
      - shared-net
    container_name: test-chatwoot-vite
    restart: unless-stopped

networks:
  shared-net:
    external: true

volumes:
  bundle_cache:
  node_modules_cache:
