# Stack de PRODUCAO-MODO do Connect (branch develop, reforma dos relatorios).
#
# Assets pre-compilados na imagem: mais leve e com carga de pagina rapida, mas
# qualquer alteracao de codigo exige rebuild (~10 min, dominado pelo
# assets:precompile). Para desenvolver, use docker-compose.dev.yml, onde o
# codigo e montado do host e uma edicao aparece na tela em segundos.
#
#   docker compose build              # so quando o codigo mudar
#   docker compose up -d
#
# Para alternar com o modo dev:
#   docker compose -f docker-compose.dev.yml down
#   docker compose up -d
#
# Duas propriedades de seguranca deliberadas, mantidas nos dois modos:
#   - o banco e a copia xpertion_relatorios, nunca o xpertion de producao
#   - sem servico de worker: sem Sidekiq os dados reais copiados nao disparam
#     nada para fora (webhooks, WhatsApp). Os relatorios leem de forma sincrona.
#
# Sem db:migrate no command: a copia ja esta no schema da develop e nao deve mudar.
#
# A stack 4.17.1 que este arquivo continha antes esta em
# .compose-backup/docker-compose.4171.yml.bak#
# Portas: os valores ficam no .env, este arquivo so os referencia. Sao duas
# variaveis por servico, porque nao sao a mesma coisa:
#   APP_PORT (3000)        porta dentro do container, igual a do Dockerfile.
#                          E por ela que o nginx fala, pela rede do Docker.
#   APP_HOST_PORT (3002)   porta publicada no host. Nao pode ser 3000: o
#                          chatwoot-rails do eletrofast ja ocupa 127.0.0.1:3000.
# Mesmo par para REDIS_PORT/REDIS_HOST_PORT.
#
# Os defaults no ${VAR:-valor} sao rede de seguranca, nao a configuracao: uma
# variavel ausente faria o compose substituir por vazio em silencio, que foi o
# que ja derrubou esta stack uma vez. Para mudar uma porta, edite o .env.
# Ao mudar APP_PORT, ajuste o vhost em nginx-docker/default.conf, que aponta
# para test-chatwoot-rails:<APP_PORT>.
services:
  test-chatwoot-redis:
    image: redis:alpine
    container_name: test-chatwoot-redis
    mem_limit: 128m
    mem_reservation: 32m
    memswap_limit: 384m
    restart: always
    networks:
      - shared-net
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: >
      redis-server --requirepass "${REDIS_PASSWORD}" --port ${REDIS_PORT:-6384} --appendonly yes
    volumes:
      - ./docker_data/redis:/data
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6384}:${REDIS_PORT:-6384}'
    env_file: .env

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Repassa o parametro do Dockerfile. O default de 4096 e o que os builds
        # deste host tem usado; baixe via .env se o build concorrer com as stacks
        # em producao e o OOM killer comecar a escolher a pg-central.
        NODE_HEAP_MB: ${NODE_HEAP_MB:-4096}
    image: connect-new:prod
    container_name: test-chatwoot-rails
    depends_on:
      - test-chatwoot-redis
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - CHATWOOT_BASE_URL=${CHATWOOT_BASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - FORCE_SSL=true
      - RAILS_FORCE_SSL=true
      - INSTALLATION_ENV=docker
      - CHATWOOT_HUB_URL=https://oriondesign.art.br/setup#
      - FRONTEND_APP_TITLE=Connect
      - BRAND_NAME=Connect
      - INSTALLATION_NAME=Connect
      - DISPLAY_MANIFEST=false
      - DB_POOL=25
      - DB_TIMEOUT=30000
      - DB_CONNECT_TIMEOUT=30
      - POSTGRES_HOST=pg-central
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=app_test
      - POSTGRES_PASSWORD=${TEST_DB_PASSWORD}
      - POSTGRES_DATABASE=xpertion_relatorios
      - REDIS_URL=redis://:${REDIS_PASSWORD}@test-chatwoot-redis:${REDIS_PORT:-6384}
      # Sem ACTIVE_RECORD_ENCRYPTION_*: a xpertion tambem roda sem elas, entao la
      # a criptografia do ActiveRecord nao esta ativa e os campos estao em claro.
      # Defini-las vazias aqui quebraria a leitura dos mesmos dados.
    ports:
      - "0.0.0.0:${APP_HOST_PORT:-3002}:${APP_PORT:-3000}"
    command: bash -lc "bundle exec rails s -b 0.0.0.0 -p ${APP_PORT:-3000}"
    networks:
      - shared-net
    mem_limit: 768m
    mem_reservation: 128m
    memswap_limit: 2048m
    restart: unless-stopped

networks:
  shared-net:
    external: true
